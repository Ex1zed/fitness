<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фитнес">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Фитнес</title>
<style>
/* Тёмный дизайн с лаймовым акцентом */
:root{--bg:#0d0e0b;--card:#1a1b17;--tx:#f2f4ea;--mu:#8d9285;--ac:#c9f13c;--ln:#2c2e27;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
h1{font-size:30px;margin:0 0 14px;letter-spacing:-.03em}
.card,.tile{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
.lime{background:var(--ac);color:#111}
.lime .mu{color:rgba(0,0,0,.6)}
.mu{color:var(--mu);font-size:14px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tt{font-weight:600;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px}
.grid .tile{margin:0}.col{display:grid;gap:12px}
.num{font-size:34px;font-weight:700;letter-spacing:-.03em}.num small{font-size:15px;font-weight:500;margin-left:3px;color:var(--mu)}
.ringbox{position:relative;width:132px;height:132px;margin:4px auto 6px}
.ringbox svg{width:100%;height:100%}.ringbox circle+circle{animation:rg 1.1s ease}
@keyframes rg{from{stroke-dasharray:0 999}}
.ringbox .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:26px;letter-spacing:-.02em}
.ringbox .in small{font-size:12px;font-weight:500;opacity:.65}
.mini{display:flex;align-items:center;gap:10px}.mini .ringbox{width:52px;height:52px;margin:0;flex:none}.mini .in{font-size:14px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mac .tile{margin:0;padding:12px}.mac b{display:block;font-size:20px}
.bar{height:5px;border-radius:3px;background:var(--ln);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input,select{font:inherit;color:inherit;background:#24261f;border:1px solid var(--ln);border-radius:14px;padding:12px;width:100%;min-width:0}
button{font:inherit;font-weight:600;color:#111;background:var(--ac);border:0;border-radius:14px;padding:11px 16px;margin:2px;transition:transform .1s}
button:active{transform:scale(.95)}button.pri{width:100%;padding:15px;margin:0}
.set{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;align-items:center;margin-top:6px}
.pop{animation:pop .6s ease}@keyframes pop{35%{transform:scale(1.14)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);background:var(--ac);color:#111;font-weight:600;padding:12px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ex{display:flex;gap:12px;align-items:center}
.ex svg{width:72px;height:72px;flex:none;background:#24261f;border-radius:16px;color:var(--ac)}
a{color:var(--ac)}label{display:block;margin:10px 0 4px}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;background:rgba(32,33,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:6px;max-width:540px;margin:0 auto}
nav button{flex:1;background:none;color:var(--mu);border-radius:20px;margin:0;padding:8px 2px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--ac);color:#111;font-weight:700}
</style></head><body><main id="v"></main>
<div id="toast"></div><nav><button data-t="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg><span>Сегодня</span></button><button data-t="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg><span>Тренировка</span></button><button data-t="prog"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg><span>Прогресс</span></button><button data-t="prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Профиль</span></button></nav>
<script>
/* ---------- Данные (хранятся на устройстве в localStorage) ---------- */
const K='fit1';
const $=s=>document.querySelector(s);
const T=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10); // локальная дата
let S=JSON.parse(localStorage.getItem(K)||'null')||{p:{age:18,h:196,w:98,sex:'m',act:1.375,def:20,goal:88},ws:[],ss:[]};
// p — профиль, ws — замеры веса [{d,w}], ss — тренировки [{d,t,ex:{название:[{w,r,q}]}}]
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Не удалось сохранить данные. Сделай экспорт в профиле.')}};
const num=x=>parseFloat(String(x).replace(',','.'));
const curW=()=>S.ws.length?S.ws[S.ws.length-1].w:S.p.w;

/* ---------- Расчёт калорий и БЖУ (Mifflin-St Jeor) ---------- */
function calc(){
  const p=S.p,w=curW();
  const bmr=10*w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=Math.round(bmr*p.act);
  const kcal=Math.round(tdee*(1-p.def/100));
  const pr=Math.round(1.8*w), f=Math.round(.8*w);          // белок 1,8 г/кг, жиры 0,8 г/кг
  const c=Math.max(0,Math.round((kcal-pr*4-f*9)/4));       // остальное — углеводы
  return {tdee,kcal,p:pr,f,c};
}

/* ---------- Программа: фуллбади A/B, 3 тренировки в неделю, 12 недель ---------- */
// [упражнение, подходов, диапазон повторов, отдых в секундах]
const P={
 A:[['Присед со штангой',3,'6-10',150],['Жим штанги лёжа',3,'6-10',150],['Тяга штанги в наклоне',3,'8-12',120],['Жим гантелей сидя',2,'8-12',90],['Румынская тяга',2,'8-12',120],['Планка (секунды)',3,'40-60',60]],
 B:[['Становая тяга',3,'5-8',180],['Жим гантелей на наклонной',3,'8-12',120],['Тяга верхнего блока',3,'8-12',90],['Выпады с гантелями',2,'10-12',90],['Разведение гантелей в стороны',2,'12-15',60],['Скручивания',3,'12-15',60]]
};
const wkNum=()=>Math.min(12,Math.floor(S.ss.length/3)+1);             // неделя программы
const nextType=()=>S.ss.length%2?'B':'A';                              // A,B,A / B,A,B ...
const phase=w=>w<=4?'адаптация, RPE 6–7':w<12?'прогрессия, RPE 7–9':'разгрузка: 2 подхода, вес полегче';
const e1rm=(w,r)=>Math.round(w*(1+r/30));                              // формула Эпли
function last(n){for(let i=S.ss.length-1;i>=0;i--)if(S.ss[i].ex[n])return S.ss[i].ex[n];return null}
function hint(n,rg){
  const l=last(n),sec=n.includes('секунд');
  if(!l)return 'Первый раз: начни с лёгкого уровня (RPE 6–7).';
  const top=+rg.split('-')[1],b=l.reduce((a,x)=>x.w>a.w?x:a,l[0]);
  const up=l.every(x=>x.r>=top)&&(sec||b.w>0);
  return 'Прошлый раз: '+l.map(x=>sec?x.r+' с':x.w+'×'+x.r).join(', ')+(!sec&&b.w>0?' (1ПМ ≈ '+e1rm(b.w,b.r)+' кг)':'')+'. '+
    (up?(sec?'Все подходы на максимуме — добавь 5–10 секунд.':'Все подходы на верхней границе — добавь 2,5 кг.'):'Цель: довести все подходы до '+top+(sec?' секунд.':' повторов.'));
}

/* ---------- Помощники: подсказки, рисунки упражнений ---------- */
let flash=null;  // что показать после сохранения веса
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');navigator.vibrate&&navigator.vibrate(30);setTimeout(()=>e.classList.remove('show'),2300)}
const kg=x=>String(x).replace('.',',');
// Схематичные рисунки: [x головы, y головы, линии тела]
const IMG={
'Присед со штангой':[31,13,'M30 21L34 40L50 40L42 56M18 21L42 21'],
'Жим штанги лёжа':[14,40,'M20 42L44 42L52 34L54 54M24 42L24 22M16 22L32 22M10 47L50 47'],
'Тяга штанги в наклоне':[48,21,'M42 26L26 34L30 46L28 58M42 26L42 44M36 44L48 44'],
'Жим гантелей сидя':[28,13,'M28 21L28 40L40 40L40 56M28 22L34 15L30 5M25 5L35 5'],
'Румынская тяга':[50,31,'M44 35L24 32L26 44L26 58M44 35L44 52M38 52L50 52'],
'Планка (секунды)':[52,37,'M8 50L46 40L46 52L56 52M4 55L60 55'],
'Становая тяга':[48,22,'M42 28L30 36L38 46L34 58M42 28L40 48M32 50L48 50'],
'Жим гантелей на наклонной':[19,23,'M24 29L40 44L52 44L54 58M24 29L28 11M23 11L33 11M18 33L40 49'],
'Тяга верхнего блока':[26,17,'M26 25L30 44L42 42L42 56M26 26L32 34L34 22M34 22L34 2M30 22L38 22'],
'Выпады с гантелями':[30,10,'M30 18L30 36L42 38L42 56M30 36L22 50L14 56'],
'Разведение гантелей в стороны':[32,10,'M32 18L32 38L26 56M32 38L38 56M32 20L12 24M32 20L52 24M12 20L12 28M52 20L52 28'],
'Скручивания':[56,34,'M4 57L60 57M40 52L52 40M40 52L32 36L22 52']
};
const fig=n=>IMG[n]?`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="${IMG[n][0]}" cy="${IMG[n][1]}" r="5" fill="currentColor" stroke="none"/><path d="${IMG[n][2]}"/></svg>`:'';
const link=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' техника выполнения');

// Кольцевой индикатор: p от 0 до 1, col — цвет дуги
const ring=(p,col)=>{const c=2*Math.PI*42;return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*Math.min(1,Math.max(0,p))} ${c}" transform="rotate(-90 50 50)"/></svg>`};
/* ---------- Экраны ---------- */
function vToday(){
  const c=calc(),wk=wkNum(),td=S.ws.find(x=>x.d===T()),f=flash;flash=null;
  const d=f?f.to-f.from:0,w=curW(),start=S.ws.length?S.ws[0].w:S.p.w;
  const tot=start-S.p.goal,pct=tot>0?(start-w)/tot:0,left=Math.max(0,w-S.p.goal);
  const wn=S.ss.filter(x=>(Date.now()-new Date(x.d))/864e5<7).length;
  const dt=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const mac=(n,g,k)=>`<div class=tile><div class=mu>${n}</div><b>${g} г</b><div class=bar><i style="width:${Math.round(g*k/c.kcal*100)}%"></i></div></div>`;
  return `<div class=mu>${dt}</div><h1>Сегодня</h1>
  <div class=grid>
   <div class="tile lime"><div class=tt>Цель дня</div>
    <div class=ringbox>${ring(pct,'#111')}<div class=in><span class="${f?'pop':''}">${c.kcal}</span><small>ккал</small></div></div>
    <div class=mu>${d?`Было ${f.from}, стало ${f.to} (${d>0?'+':''}${d})`:`Путь к цели: ${Math.round(Math.max(0,pct)*100)}%`}</div></div>
   <div class=col>
    <div class=tile><div class=tt>Вес</div><div class="num ${f?'pop':''}">${kg(w)}<small>кг</small></div><div class=mu>${td?'✓ записан сегодня':'до цели '+kg(left.toFixed(1))+' кг'}</div></div>
    <div class="tile mini"><div class=ringbox>${ring(wn/3,'var(--ac)')}<div class=in>${wn}/3</div></div><div><div class=tt>Неделя</div><div class=mu>тренировок</div></div></div>
   </div></div>
  <div class=mac>${mac('Белки',c.p,4)}${mac('Жиры',c.f,9)}${mac('Углеводы',c.c,4)}</div>
  <div class=card><div class=tt>Записать вес, кг</div><div class=row><input id=wi inputmode=decimal placeholder="${kg(w)}"><button onclick="addW()">${td?'Обновить':'Сохранить'}</button></div><div class=mu>Расход около ${c.tdee} ккал, дефицит ${S.p.def}%</div></div>
  <div class=card><div class=mu>Неделя программы ${wk} из 12, ${phase(wk)}</div><div class=big>Тренировка ${nextType()}</div><button class=pri onclick="tab('train')">Начать</button></div>`;
}
function addW(){
  const w=num($('#wi').value);
  if(!(w>=40&&w<=250))return alert('Введи вес от 40 до 250 кг');
  const from=calc().kcal;
  S.ws=S.ws.filter(x=>x.d!==T());S.ws.push({d:T(),w});S.ws.sort((a,b)=>a.d<b.d?-1:1);
  save();flash={from,to:calc().kcal};tab('today');toast('Вес '+kg(w)+' кг сохранён');
}
function vTrain(){
  const t=nextType(),wk=wkNum();
  let h=`<h1>Тренировка ${t}</h1><div class=mu>Неделя ${wk}: ${phase(wk)}</div>
  <div class=card>Таймер отдыха <button onclick="rest(60)">60</button><button onclick="rest(90)">90</button><button onclick="rest(120)">120</button><button onclick="rest(180)">180</button> <b id=tt></b></div>`;
  P[t].forEach((e,i)=>{
    const n=wk===12?Math.min(e[1],2):e[1],l=last(e[0]),sec=e[0].includes('секунд');
    h+=`<div class=card data-i=${i}><div class=ex>${fig(e[0])}<div><b>${e[0]}</b><div class=mu>${n}×${e[2]}${sec?' сек':''}, отдых ${e[3]} с</div><a href="${link(e[0])}" target=_blank rel=noopener>Видео с техникой</a></div></div><div class=mu style="margin-top:8px">${hint(e[0],e[2])}</div>`;
    for(let s=0;s<n;s++)h+=`<div class=set><span class=mu>${s+1}</span><input inputmode=decimal placeholder="кг" ${sec?'hidden':''} value="${!sec&&l&&l[s]&&l[s].w?l[s].w:''}"><input inputmode=numeric placeholder="${sec?'секунды':'повторы'}"><input inputmode=decimal placeholder="RPE"></div>`;
    h+='</div>';
  });
  return h+'<button class=pri onclick="finish()">Завершить тренировку</button>'+hist();
}
function finish(){
  const t=nextType(),ex={};
  document.querySelectorAll('[data-i]').forEach(c=>{
    const sets=[];
    c.querySelectorAll('.set').forEach(r=>{
      const [w,rp,q]=[...r.querySelectorAll('input')].map(x=>num(x.value));
      if(rp>0)sets.push({w:w||0,r:rp,q:q||null});   // сохраняем только подходы с повторами
    });
    if(sets.length)ex[P[t][c.dataset.i][0]]=sets;
  });
  if(!Object.keys(ex).length)return alert('Заполни повторы хотя бы в одном подходе');
  S.ss.push({d:T(),t,ex});save();tab('train');toast('Тренировка '+t+' сохранена');
}
function hist(){
  if(!S.ss.length)return '';
  return '<h1 style="font-size:20px;margin-top:20px">Последние тренировки</h1>'+S.ss.slice(-5).reverse().map(s=>{
    const vol=Object.values(s.ex).flat().reduce((a,x)=>a+x.w*x.r,0);
    return `<div class=card><div class=row><b>${s.d}, тренировка ${s.t}</b><span class=mu>объём ${Math.round(vol)} кг</span></div></div>`}).join('');
}
let tmr;
function rest(s){  // таймер отдыха
  clearInterval(tmr);let n=s;const el=$('#tt');
  const f=()=>{el.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n--<=0){clearInterval(tmr);el.textContent='Пора работать';navigator.vibrate&&navigator.vibrate(300)}};
  f();tmr=setInterval(f,1000);
}
function chart(){
  const a=S.ws;
  if(a.length<2)return '<div class=mu>Добавь хотя бы два замера веса на вкладке «Сегодня».</div>';
  const v=a.map(x=>x.w),mn=Math.min(...v,S.p.goal)-1,mx=Math.max(...v)+1,W=320,H=150;
  const X=i=>10+i*(W-20)/(a.length-1),Y=x=>H-10-(x-mn)/(mx-mn)*(H-20);
  const ma=a.map((_,i)=>{const s=a.slice(Math.max(0,i-6),i+1);return s.reduce((p,x)=>p+x.w,0)/s.length});
  const pl=arr=>arr.map((x,i)=>X(i)+','+Y(x)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="10" x2="310" y1="${Y(S.p.goal)}" y2="${Y(S.p.goal)}" stroke="var(--mu)" stroke-dasharray="4"/><polyline points="${pl(v)}" fill="none" stroke="var(--mu)" stroke-width="1.5"/><polyline points="${pl(ma)}" fill="none" stroke="var(--ac)" stroke-width="3"/></svg>
  <div class=mu>Тонкая линия — замеры, толстая — среднее за 7 записей, пунктир — цель ${S.p.goal} кг</div>`;
}
function rate(){  // темп: среднее за последние 7 дней против предыдущих 7
  const n=Date.now(),d=x=>(n-new Date(x.d))/864e5;
  const a=S.ws.filter(x=>d(x)<=7),b=S.ws.filter(x=>d(x)>7&&d(x)<=14);
  if(!a.length||!b.length)return 'Для оценки темпа нужны замеры за две недели.';
  const m=z=>z.reduce((p,x)=>p+x.w,0)/z.length,r=m(a)-m(b);
  return `Темп за неделю: ${r.toFixed(2)} кг. `+(r>-0.3?'Медленнее цели: можно убавить калории примерно на 150 ккал.':r<-1?'Слишком быстро: добавь около 150 ккал, чтобы не терять мышцы.':'Темп в норме, ничего менять не нужно.');
}
function rm(){
  const o={};
  S.ss.forEach(s=>Object.entries(s.ex).forEach(([n,a])=>a.forEach(x=>{if(x.w>0){const v=e1rm(x.w,x.r);if(!o[n]||v>o[n])o[n]=v}})));
  return Object.entries(o).map(([n,v])=>`<div class=row><span>${n}</span><b>${v} кг</b></div>`).join('')||'<div class=mu>Появится после первой тренировки с весом.</div>';
}
function vProg(){
  const left=Math.max(0,curW()-S.p.goal).toFixed(1);
  return `<h1>Прогресс</h1><div class=card><div class=mu>Сейчас ${curW()} кг, до цели ${left} кг</div>${chart()}<p>${rate()}</p></div>
  <div class=card><b>Расчётный 1ПМ</b>${rm()}</div>`;
}
function vProf(){
  const p=S.p,o=(v,t)=>`<option value="${v}" ${p.act==v?'selected':''}>${t}</option>`;
  return `<h1>Профиль</h1><div class=card>
  <label>Возраст</label><input id=a inputmode=numeric value="${p.age}">
  <label>Рост, см</label><input id=h inputmode=numeric value="${p.h}">
  <label>Пол</label><select id=s><option value=m ${p.sex==='m'?'selected':''}>Мужской</option><option value=f ${p.sex==='f'?'selected':''}>Женский</option></select>
  <label>Активность</label><select id=ac>${o(1.2,'Сидячая, без тренировок')}${o(1.375,'Сидячая и 3 тренировки')}${o(1.55,'Активная')}</select>
  <label>Дефицит калорий, %</label><input id=df inputmode=numeric value="${p.def}">
  <label>Цель по весу, кг</label><input id=g inputmode=decimal value="${p.goal}">
  <p><button class=pri onclick="saveP()">Сохранить</button></p></div>
  <div class=card><b>Резервная копия</b><p class=mu>Данные лежат только на этом устройстве. Делай экспорт раз в неделю и при переносе на другое устройство.</p>
  <button onclick="exp()">Экспорт</button><button onclick="$('#f').click()">Импорт</button><input id=f type=file accept=".json" hidden onchange="imp(this)"></div>`;
}
function saveP(){
  const p={age:num($('#a').value),h:num($('#h').value),sex:$('#s').value,act:num($('#ac').value),def:num($('#df').value),goal:num($('#g').value),w:S.p.w};
  if(!(p.age>=14&&p.h>=120&&p.def>=0&&p.def<=25&&p.goal>=40))return alert('Проверь значения. Дефицит — не больше 25%.');
  S.p=p;save();tab('today');
}
function exp(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='fitness-'+T()+'.json';a.click();
}
function imp(i){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p||!d.ws||!d.ss)throw 0;S=d;save();tab('today')}catch(e){alert('Файл не подходит')}};
  r.readAsText(i.files[0]);
}

/* ---------- Навигация ---------- */
const V={today:vToday,train:vTrain,prog:vProg,prof:vProf};
function tab(n){
  clearInterval(tmr);
  $('#v').innerHTML=V[n]();scrollTo(0,0);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
tab('today');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();  // просим не удалять данные
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
